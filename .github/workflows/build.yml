name: Build

# Ein Meilenstein ist erst fertig, wenn dieser Check grün ist.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bauen
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: riftverse-jar
          path: build/libs/*.jar
          if-no-files-found: error
