name: Build

# Ein Meilenstein ist erst fertig, wenn dieser Check grün ist.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Bauen
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Jar hochladen
        uses: actions/upload-artifact@v5
        with:
          name: riftverse-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Startet einen Server mit dem Mod, prüft Registrierung, Datapack-JSON, Rezepte, das Stromnetz
      # (Kreativ-Quelle -> Kupferkabel -> Erzmühle, Überspannung, Xenit-Zelle), die Maschinen aus
      # Meilenstein 2, die drei Universumstypen, einen Meteoritenkrater und die Portal-Kanone.
      - name: Rauchtest
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          timeout 1200 ./gradlew runRauchtest --no-daemon 2>&1 | tee rauchtest.log
          echo "---- Riftverse-Fehler und -Warnungen im Log ----"
          grep -E "/(ERROR|WARN)\].*riftverse" rauchtest.log || true
          grep -q "RIFTVERSE-RAUCHTEST: BESTANDEN" rauchtest.log
          if grep -E "/ERROR\].*riftverse" rauchtest.log; then
            echo "Fehler mit riftverse im Server-Log"
            exit 1
          fi
          # Datapack-Fehler stehen oft in Folgezeilen (z. B. fehlende Tag-Einträge "(from mod/riftverse)")
          if grep -E "from mod/riftverse|Couldn't parse data file riftverse:|Failed to (load|parse).*riftverse:" rauchtest.log; then
            echo "Datapack-Fehler im Riftverse-Mod"
            exit 1
          fi

      - name: Rauchtest-Log hochladen
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rauchtest-log
          path: rauchtest.log
          if-no-files-found: ignore
