[[mods]]
modId="riftverse"
version="1.0.0"
displayName="Riftverse"
authors="David Chapman"
description='''
Baue eine Rift-Kanone, schiess Portale in zufaellig generierte Universen mit eigener Physik
und triff auf Bosse, deren Geschichten in Echtzeit erzeugt werden.
'''

# Spiegelwelt: vertauschte Tageszeit (dev.riftverse.mixin.DimensionTypeMixin)
[[mixins]]
config="riftverse.mixins.json"

[[dependencies.riftverse]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.riftverse]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

# Optionale Integrationen: Rezeptanzeigen und Blockinfos
